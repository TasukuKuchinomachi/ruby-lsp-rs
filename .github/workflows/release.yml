name: Release
on:
  push:
    tags: ["steep-*"]

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TARGET: x86_64-unknown-linux-musl
      ARCHIVE: ruby-type-check-x86_64-unknown-linux-musl.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Alpine 上でビルドすると build script まで静的リンクされ、bindgen が libclang を読み込めないので、glibc からクロスコンパイルする
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools clang libclang-dev
          rustup target add "$TARGET"
      - name: Build
        env:
          BINDGEN_EXTRA_CLANG_ARGS: -I/usr/include/x86_64-linux-musl
        run: cargo build --release --locked -p ruby-type-check --target "$TARGET"
      - name: Package
        run: |
          tar -czf "$ARCHIVE" -C "target/$TARGET/release" ruby-type-check
          sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "$ARCHIVE" "$ARCHIVE.sha256"
      - name: Move the branch of this Steep version to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="${GITHUB_REF_NAME%-r*}"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$GITHUB_SHA" -F force=false
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA"
          fi
