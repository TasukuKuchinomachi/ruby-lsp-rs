[package]
name = "ruby-lsp-rs"
version.workspace = true
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
fancy-regex = "0.19.2"
globset = "0.4.20"
indexmap = "2.14.2"
log = "0.4.34"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
rayon = "1.12.0"
prism-child-nodes = { path = "crates/prism-child-nodes" }
rbs-environment = { path = "crates/rbs-environment" }
ruby-environment = { path = "crates/ruby-environment" }
ruby-file-glob = { path = "crates/ruby-file-glob" }
ruby-prism = { workspace = true }
ruby-rbs = { workspace = true }
ruby-type-check = { path = "crates/ruby-type-check" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { workspace = true }
thiserror = "2.0.21"
type-checker = { path = "crates/type-checker" }
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
ruby-prism = "1.9.0"
ruby-rbs = "0.3.0"
serde_yaml = "0.9.34"
