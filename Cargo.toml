[package]
name = "ruby-lsp-rs"
version.workspace = true
edition.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
fancy-regex = "0.19.2"
globset = "0.4.20"
indexmap.workspace = true
log = "0.4.34"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
rayon = "1.12.0"
prism-child-nodes = { path = "crates/prism-child-nodes" }
rbs-definition = { path = "crates/rbs-definition" }
ruby-environment = { path = "crates/ruby-environment" }
ruby-file-glob = { path = "crates/ruby-file-glob" }
ruby-prism = { workspace = true }
ruby-rbs = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { workspace = true }
steep = { path = "crates/steep" }
steep-interface = { path = "crates/steep-interface" }
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
indexmap = "2.14.2"
ruby-prism = "1.9.0"
ruby-rbs = "0.3.0"
ruby-rbs-sys = "0.3.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
